name: E2E Tests

on:
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      VITE_SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
      VITE_SANITY_DATASET: ${{ vars.VITE_SANITY_DATASET }}
      VITE_SANITY_API_VERSION: ${{ vars.VITE_SANITY_API_VERSION }}
      NITRO_PRESET: node-server
      # Contact form (Neon + Zoho SMTP) — required by the e2e production server
      # Host defaults to smtp.zoho.com:465 in app code when unset.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ZOHO_SMTP_USER: ${{ secrets.ZOHO_SMTP_USER }}
      ZOHO_SMTP_PASS: ${{ secrets.ZOHO_SMTP_PASS }}
      ZOHO_SMTP_FROM: ${{ secrets.ZOHO_SMTP_FROM }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm test

      - name: Upload test report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
